<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEP Tengah Semester Ganjil - Bahasa Indonesia IX - SMPN 38 Bandung</title>
<style>
:root{--bg:#f3f6fa;--ink:#14213d;--mut:#5b6785;--ac:#1f6f5c;--acl:#dff1ec;--ln:#d5dbe8;--rd:#c1121f;--w:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
#app{max-width:820px;margin:0 auto;padding:12px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:10px;padding:18px;margin:12px 0}
h1{font:700 1.5rem/1.3 Georgia,"Times New Roman",serif;margin:.2em 0}
h2{font-size:1.05rem;margin:0 0 8px}
.mut{color:var(--mut);font-size:.9rem}
label.f{display:block;margin:10px 0 4px;font-weight:600}
.in,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:600 1rem inherit;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.in:focus-visible,select:focus-visible,.n:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}
.n{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:6px 0;text-align:center;cursor:pointer;font:600 .85rem inherit;color:var(--ink)}
.n.a{background:var(--acl);border-color:var(--ac)}
.n.c{background:var(--ink);color:#fff}
.tag{display:inline-block;background:var(--acl);color:var(--ac);border-radius:20px;padding:2px 12px;font-size:.82rem;font-weight:600;margin:0 6px 8px 0}
.st{background:#f7f9fc;border-left:4px solid var(--ac);padding:10px 14px;margin:10px 0;white-space:pre-line}
.o{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;margin:7px 0;cursor:pointer}
.o:hover{background:#f7f9fc}
.o input{margin-top:6px}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{border:1px solid var(--ln);padding:8px;text-align:left;vertical-align:middle}
th{background:#f7f9fc}
td.c,th.c{text-align:center;width:70px}
.bar{display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}
.note{background:#fff8e1;border:1px solid #f0b429;border-radius:8px;padding:8px 12px;font-size:.9rem;margin:10px 0}
#warn{display:none;position:fixed;inset:0;background:rgba(20,33,61,.92);z-index:99;align-items:center;justify-content:center;padding:20px}
#warn div{background:#fff;border-top:8px solid var(--rd);border-radius:10px;max-width:440px;padding:22px;text-align:center}
.big{font:700 4rem/1 Georgia,serif;color:var(--ac)}
@media(max-width:560px){.nav{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="warn"><div><h2 style="color:var(--rd);font-size:1.3rem">Peringatan!</h2><p>Kamu terdeteksi meninggalkan halaman ujian (membuka tab atau jendela lain). Kejadian ini <b>dicatat</b> dan dilaporkan kepada guru. Tetaplah di halaman ini sampai ujian dikumpulkan.</p><p class="mut" id="wc"></p><button class="btn" onclick="document.getElementById('warn').style.display='none'">Kembali mengerjakan</button></div></div>
<script>
/* ===== PENGATURAN ===== */
const SCRIPT_URL = "";   // tempel URL Web App Google Apps Script di sini
const MENIT = 90;        // durasi ujian

/* ===== BANK SOAL (b: D=Deskripsi, P=Prosedur, R=Rekon) ===== */
const Q=[
{b:"D",y:"mc",t:"Pantai Pangandaran memiliki hamparan pasir cokelat keemasan yang luas. Ombaknya berkejaran pelan, dan angin lautnya yang sejuk membuat pengunjung betah berlama-lama.",q:"Objek yang dideskripsikan dalam teks tersebut adalah ....",o:["ombak laut","Pantai Pangandaran","angin laut","pengunjung pantai"],a:1},
{b:"D",y:"mc",t:"Gunung itu menjulang gagah. Puncaknya berselimut kabut tipis, sedangkan lerengnya hijau dan subur.",q:"Kata sifat sebagai ciri kebahasaan teks deskripsi pada kutipan tersebut adalah ....",o:["menjulang, berselimut","gagah, tipis, hijau","gunung, puncak, lereng","sedangkan, dan"],a:1},
{b:"D",y:"mc",t:"(1) Kebun Binatang Bandung terletak di Jalan Tamansari.\n(2) Di sana terdapat harimau sumatra yang bergerak lincah di kandang luas.\n(3) Pengunjung dapat melihat gajah mandi setiap pukul sepuluh pagi.",q:"Kalimat identifikasi (pengenalan objek) terdapat pada nomor ....",o:["(1)","(2)","(3)","(2) dan (3)"],a:0},
{b:"D",y:"mm",q:"Pilih semua ciri teks deskripsi! Jawaban benar lebih dari satu.",o:["Menggambarkan objek secara rinci","Banyak menggunakan kata sifat","Berisi langkah-langkah yang berurutan","Melibatkan kesan pancaindra","Menceritakan peristiwa secara kronologis"],a:[0,1,3]},
{b:"D",y:"tf",t:"Situ Patenggang berada di Kabupaten Bandung. Danau ini dikelilingi kebun teh yang menghampar hijau. Udaranya sejuk, dan permukaan airnya tenang memantulkan bayangan bukit di sekitarnya.",q:"Tentukan Benar atau Salah pada setiap pernyataan berikut!",s:[["Situ Patenggang dikelilingi kebun teh.",1],["Suasana di Situ Patenggang panas dan bising.",0],["Permukaan air danau tenang.",1]]},
{b:"D",y:"mt",q:"Jodohkan kalimat dengan jenis citraan yang tepat!",m:[["Suara gamelan mengalun lembut dari pendapa.","Citraan pendengaran"],["Aroma sate kambing menggoda selera.","Citraan penciuman"],["Kabut putih menyelimuti lembah.","Citraan penglihatan"],["Kopi itu terasa pahit di lidah.","Citraan pengecapan"]]},
{b:"D",y:"sa",t:"Rumah tua itu berdiri sunyi di ujung gang.",q:"Kata sifat yang bermakna 'tidak ada suara' pada kalimat tersebut adalah ....",a:["sunyi"]},
{b:"D",y:"mc",t:"Jalan setapak itu dinaungi pohon mahoni yang rimbun.",q:"Makna kata rimbun pada kalimat tersebut adalah ....",o:["tinggi","lebat","kering","tua"],a:1},
{b:"D",y:"tf",t:"Pasar Baru Bandung ramai sejak pagi. Pedagang menata kain warna-warni di lapak kayu. Suara tawar-menawar bersahutan, sementara aroma gorengan menyebar dari sudut pasar.",q:"Tentukan Benar atau Salah pada setiap pernyataan berikut!",s:[["Pasar tersebut ramai sejak pagi.",1],["Pedagang menjual buah di lapak besi.",0],["Teks memuat citraan pendengaran dan penciuman.",1],["Suasana pasar tenang dan sepi.",0]]},
{b:"D",y:"mt",q:"Jodohkan bagian struktur teks deskripsi dengan isinya!",m:[["Identifikasi","Pengenalan objek yang dideskripsikan"],["Deskripsi bagian","Penggambaran ciri-ciri objek secara rinci"],["Simpulan","Kesan atau penilaian penulis terhadap objek"]]},
{b:"P",y:"mc",q:"Ciri kebahasaan teks prosedur yang tepat adalah ....",o:["Menggunakan kalimat perintah dan kata penunjuk urutan","Menggunakan kata sifat untuk melukiskan objek","Menggunakan kata kerja lampau","Menggunakan kata ganti orang pertama"],a:0},
{b:"P",y:"mc",q:"Struktur teks prosedur yang tepat adalah ....",o:["Orientasi - peristiwa - reorientasi","Tujuan - alat dan bahan - langkah-langkah","Identifikasi - deskripsi bagian - simpulan","Pernyataan umum - argumentasi - penegasan"],a:1},
{b:"P",y:"mc",t:"(1) Tuang air panas ke gelas.\n(2) Siapkan gelas, teh celup, dan gula.\n(3) Masukkan teh celup dan gula.\n(4) Aduk hingga gula larut.",q:"Urutan langkah membuat teh manis yang benar adalah ....",o:["(2) - (1) - (3) - (4)","(2) - (3) - (1) - (4)","(1) - (2) - (3) - (4)","(3) - (2) - (1) - (4)"],a:1},
{b:"P",y:"mm",q:"Pilih semua kata penanda urutan (konjungsi temporal)! Jawaban benar lebih dari satu.",o:["kemudian","selanjutnya","karena","setelah itu","tetapi"],a:[0,1,3]},
{b:"P",y:"tf",t:"Cara mencuci tangan:\n(1) Basahi tangan dengan air mengalir.\n(2) Tuang sabun secukupnya.\n(3) Gosok telapak, punggung tangan, dan sela jari selama 20 detik.\n(4) Bilas hingga bersih, lalu keringkan dengan tisu.",q:"Tentukan Benar atau Salah pada setiap pernyataan berikut!",s:[["Sabun dituang setelah tangan dibasahi.",1],["Tangan digosok selama 2 menit.",0],["Tangan dikeringkan setelah dibilas.",1]]},
{b:"P",y:"mt",q:"Jodohkan bagian teks prosedur dengan contoh isinya!",m:[["Tujuan","Cara membuat pupuk kompos dari sampah dapur"],["Alat dan bahan","Ember, sisa sayuran, dan tanah"],["Langkah-langkah","Potong sisa sayuran, campur dengan tanah, lalu aduk"]]},
{b:"P",y:"sa",t:"Tuangkan air panas ke dalam gelas.",q:"Kata kerja perintah pada kalimat tersebut adalah ....",a:["tuangkan"]},
{b:"P",y:"mc",q:"Kalimat berita \u201CAir dimasukkan ke dalam panci\u201D jika diubah menjadi kalimat perintah untuk teks prosedur menjadi ....",o:["Air akan dimasukkan ke dalam panci.","Masukkan air ke dalam panci.","Air telah dimasukkan ke panci.","Panci berisi air."],a:1},
{b:"P",y:"mm",q:"Pilih semua kalimat langkah pada teks \u201CCara Menanam Cabai\u201D yang sudah sesuai kaidah teks prosedur! Jawaban benar lebih dari satu.",o:["Siramlah tanah hingga lembap.","Bibit ditanam oleh petani kemarin.","Letakkan polibag di tempat yang terkena sinar matahari.","Cabai itu sangat pedas dan merah.","Tutup bibit dengan tanah tipis."],a:[0,2,4]},
{b:"P",y:"sa",q:"Teks yang berisi petunjuk melakukan sesuatu secara berurutan disebut teks ....",a:["prosedur"]},
{b:"R",y:"mc",t:"Minggu lalu, keluarga kami berlibur ke Lembang bersama nenek dan sepupu.",q:"Kalimat tersebut merupakan bagian ... teks rekon.",o:["orientasi","peristiwa","reorientasi","evaluasi"],a:0},
{b:"R",y:"mc",t:"Kemarin aku pergi ke perpustakaan. Aku meminjam dua buku, lalu membacanya di taman.",q:"Ciri kebahasaan teks rekon yang terdapat pada kutipan tersebut adalah ....",o:["kalimat perintah dan kata sifat","kata kerja lampau dan konjungsi waktu","kata tanya dan kata seru","kata benda abstrak dan definisi"],a:1},
{b:"R",y:"mm",q:"Pilih semua kata penanda waktu lampau yang lazim dipakai pada teks rekon! Jawaban benar lebih dari satu.",o:["kemarin","tadi pagi","besok","minggu lalu","nanti sore"],a:[0,1,3]},
{b:"R",y:"tf",t:"Sabtu lalu, kelas 9C mengadakan kerja bakti di sekolah. Mula-mula, siswa membersihkan halaman. Setelah itu, mereka mengecat pagar. Akhirnya, kegiatan selesai pukul 11.00 dan mereka pulang dengan gembira.",q:"Tentukan Benar atau Salah pada setiap pernyataan berikut!",s:[["Kerja bakti dilakukan pada hari Sabtu lalu.",1],["Siswa mengecat pagar sebelum membersihkan halaman.",0],["Kegiatan selesai pukul 11.00.",1]]},
{b:"R",y:"mt",q:"Jodohkan kutipan dengan bagian struktur teks rekon!",m:[["Pada hari Minggu, aku dan ayah memancing di Danau Saguling.","Orientasi"],["Mula-mula ayah memasang umpan, kemudian aku melempar kail.","Peristiwa"],["Kami pulang dengan hati senang dan membawa banyak ikan.","Reorientasi"]]},
{b:"R",y:"sa",q:"Bagian akhir teks rekon yang berisi komentar atau kesan penulis disebut ....",a:["reorientasi"]},
{b:"R",y:"mc",t:"(1) Setelah tiba, kami mendirikan tenda.\n(2) Kami berangkat ke bumi perkemahan pukul enam pagi.\n(3) Malam harinya, kami berkumpul mengelilingi api unggun.\n(4) Sebelum berangkat, Pak Guru mengecek daftar hadir.",q:"Urutan kronologis peristiwa yang tepat adalah ....",o:["(4) - (2) - (1) - (3)","(2) - (4) - (1) - (3)","(4) - (1) - (2) - (3)","(1) - (2) - (3) - (4)"],a:0},
{b:"R",y:"mc",t:"Kemarin aku mengikuti lomba pidato. Aku gugup, tetapi tetap berusaha tampil percaya diri.",q:"Sudut pandang yang digunakan penulis adalah orang ....",o:["pertama tunggal","pertama jamak","kedua","ketiga"],a:0},
{b:"R",y:"tf",t:"Tadi pagi, Dimas terlambat ke sekolah karena ban sepedanya bocor. Ia menuntun sepedanya ke bengkel, lalu berlari ke sekolah. Sesampainya di sekolah, Pak Satpam mengizinkannya masuk. Dimas berjanji memeriksa sepedanya setiap malam.",q:"Tentukan Benar atau Salah pada setiap pernyataan berikut!",s:[["Dimas terlambat karena ban sepedanya bocor.",1],["Dimas naik angkot ke sekolah.",0],["Dimas berjanji memeriksa sepeda setiap malam.",1]]},
{b:"R",y:"sa",t:"Setelah selesai belajar, Dika tidur.",q:"Konjungsi temporal pada kalimat tersebut adalah ....",a:["setelah"]}
];
const TL={mc:"Pilihan Ganda",mm:"Pilihan Ganda Majemuk",tf:"Benar / Salah",mt:"Menjodohkan",sa:"Uraian Singkat"};
const BL={D:"Teks Deskripsi",P:"Teks Prosedur",R:"Teks Rekon"};

/* ===== STATE ===== */
let S={a:{},c:0,v:0,g:false,t0:0,end:0,info:{},done:false,lv:0,tm:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=$("#app");

/* ===== LAYAR AWAL ===== */
function home(){
app.innerHTML=`<div class="card"><h1>Asesmen Evaluasi Pembelajaran (AEP)<br>Tengah Semester Ganjil</h1>
<p class="mut">Bahasa Indonesia Kelas IX &middot; SMP Negeri 38 Bandung &middot; Tahun Ajaran 2026/2027</p>
<p>${Q.length} soal &middot; ${MENIT} menit &middot; teks deskripsi, prosedur, dan rekon</p>
<div class="note"><b>Aturan:</b> setelah kamu menjawab nomor 1, halaman ujian dikunci. Jika kamu membuka tab atau jendela lain, akan muncul peringatan dan pelanggaran dicatat untuk guru. Jangan menutup atau memuat ulang halaman.</div>
<label class="f" for="nm">Nama lengkap</label><input class="in" id="nm" autocomplete="off">
<label class="f" for="kl">Kelas</label><input class="in" id="kl" placeholder="contoh: 9A" autocomplete="off">
<label class="f" for="ab">Nomor absen</label><input class="in" id="ab" inputmode="numeric" autocomplete="off">
<p id="er" style="color:var(--rd);min-height:1.4em"></p>
<button class="btn" onclick="mulai()">Mulai mengerjakan</button></div>`;
}
function mulai(){
const nm=$("#nm").value.trim(),kl=$("#kl").value.trim(),ab=$("#ab").value.trim();
if(!nm||!kl||!ab){$("#er").textContent="Isi nama, kelas, dan nomor absen terlebih dahulu.";return}
S.info={nama:nm,kelas:kl,absen:ab};S.t0=Date.now();S.end=S.t0+MENIT*60000;
S.tm=setInterval(tick,1000);render();
}
function tick(){
const r=S.end-Date.now();
if(r<=0){kumpul(true);return}
const e=$("#tm");if(e)e.textContent=String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r%60000/1000)).padStart(2,"0");
}

/* ===== TAMPILAN SOAL ===== */
function ans(i){
const a=S.a[i];if(a==null)return false;
if(typeof a==="string")return a.trim()!=="";
if(typeof a==="object")return Object.values(a).some(v=>v!==""&&v!=null);
return true;
}
function navHtml(){return Q.map((q,i)=>`<button class="n ${ans(i)?"a":""} ${i===S.c?"c":""}" onclick="go(${i})" aria-label="Soal ${i+1}">${i+1}</button>`).join("")}
function upd(){
$("#nav").innerHTML=navHtml();
if(!S.g&&ans(0)){S.g=true;const n=$("#gn");if(n)n.style.display="block"}
}
function go(i){S.c=i;render();window.scrollTo(0,0)}
function render(){
const q=Q[S.c],a=S.a[S.c];let b="";
if(q.y==="mc")b=q.o.map((x,i)=>`<label class="o"><input type="radio" name="r" ${a===i?"checked":""} onchange="A(${i})"><span>${"ABCD"[i]}. ${esc(x)}</span></label>`).join("");
if(q.y==="mm")b=q.o.map((x,i)=>`<label class="o"><input type="checkbox" ${(a||[]).includes(i)?"checked":""} onchange="M(${i},this.checked)"><span>${esc(x)}</span></label>`).join("");
if(q.y==="tf")b=`<table><tr><th>Pernyataan</th><th class="c">Benar</th><th class="c">Salah</th></tr>${q.s.map((s,j)=>`<tr><td>${esc(s[0])}</td><td class="c"><input type="radio" name="t${j}" aria-label="Benar" ${a&&a[j]===1?"checked":""} onchange="T(${j},1)"></td><td class="c"><input type="radio" name="t${j}" aria-label="Salah" ${a&&a[j]===0?"checked":""} onchange="T(${j},0)"></td></tr>`).join("")}</table>`;
if(q.y==="mt"){const rs=q.m.map(m=>m[1]).sort();b=`<table>${q.m.map((m,j)=>`<tr><td>${esc(m[0])}</td><td><select onchange="J(${j},this.value)"><option value="">-- pilih --</option>${rs.map(r=>`<option ${a&&a[j]===r?"selected":""}>${esc(r)}</option>`).join("")}</select></td></tr>`).join("")}</table>`}
if(q.y==="sa")b=`<input class="in" autocomplete="off" placeholder="Ketik jawabanmu" value="${esc(a||"")}" oninput="Sa(this.value)">`;
app.innerHTML=`<div class="top"><b>${esc(S.info.nama)} &middot; ${esc(S.info.kelas)}</b><span>Sisa waktu <b id="tm">--:--</b></span><span>Pelanggaran: <b id="vc">${S.v}</b></span></div>
<div class="nav" id="nav">${navHtml()}</div>
<div class="card"><span class="tag">Soal ${S.c+1} dari ${Q.length}</span><span class="tag">${BL[q.b]}</span><span class="tag">${TL[q.y]}</span>
${q.t?`<div class="st">${esc(q.t)}</div>`:""}<p><b>${esc(q.q)}</b></p>${b}
<div class="note" id="gn" style="display:${S.g?"block":"none"}">Mode ujian aktif: jangan berpindah tab atau jendela.</div>
<div class="bar"><button class="btn g" ${S.c===0?"disabled":""} onclick="go(S.c-1)">Sebelumnya</button>
${S.c<Q.length-1?`<button class="btn" onclick="go(S.c+1)">Selanjutnya</button>`:`<button class="btn" onclick="kumpul(false)">Kumpulkan jawaban</button>`}</div></div>`;
tick();
}
/* pengisi jawaban */
function A(i){S.a[S.c]=i;upd()}
function M(i,on){let a=S.a[S.c]||[];a=on?[...new Set([...a,i])]:a.filter(x=>x!==i);S.a[S.c]=a;upd()}
function T(j,v){S.a[S.c]=Object.assign({},S.a[S.c],{[j]:v});upd()}
function J(j,v){S.a[S.c]=Object.assign({},S.a[S.c],{[j]:v});upd()}
function Sa(v){S.a[S.c]=v;upd()}

/* ===== PENILAIAN ===== */
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g," ").trim();
function skor(i){
const q=Q[i],a=S.a[i];if(!ans(i))return 0;
if(q.y==="mc")return a===q.a?1:0;
if(q.y==="mm"){const c=a.filter(x=>q.a.includes(x)).length,w=a.length-c;return Math.max(0,(c-w)/q.a.length)}
if(q.y==="tf")return q.s.filter((s,j)=>a[j]===s[1]).length/q.s.length;
if(q.y==="mt")return q.m.filter((m,j)=>a[j]===m[1]).length/q.m.length;
if(q.y==="sa")return q.a.includes(norm(a))?1:0;
return 0;
}

/* ===== PENGUMPULAN ===== */
async function kumpul(auto){
if(S.done)return;
const kosong=Q.filter((q,i)=>!ans(i)).length;
if(!auto&&!confirm(kosong?`Masih ada ${kosong} soal belum dijawab. Tetap kumpulkan?`:"Kumpulkan jawaban sekarang? Jawaban tidak dapat diubah lagi."))return;
S.done=true;clearInterval(S.tm);$("#warn").style.display="none";
const ps={D:0,P:0,R:0},pm={D:0,P:0,R:0};let tot=0;
Q.forEach((q,i)=>{const s=skor(i);ps[q.b]+=s;pm[q.b]++;tot+=s});
const nilai=Math.round(tot/Q.length*1000)/10;
const pb=k=>Math.round(ps[k]/pm[k]*1000)/10;
S.res={waktu:new Date().toLocaleString("id-ID"),nama:S.info.nama,kelas:S.info.kelas,absen:S.info.absen,nilai,D:pb("D"),P:pb("P"),R:pb("R"),pelanggaran:S.v,durasi:Math.round((Date.now()-S.t0)/600)/100,jawaban:JSON.stringify(S.a)};
try{localStorage.setItem("aep_"+S.info.nama+"_"+Date.now(),JSON.stringify(S.res))}catch(e){}
hasil("Mengirim hasil ke guru...");
hasil(await kirim());
}
async function kirim(){
if(!SCRIPT_URL)return"Alamat pengiriman (SCRIPT_URL) belum diisi. Hasil hanya tersimpan di perangkat ini; beritahu gurumu.";
try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(S.res)});return"ok"}
catch(e){return"Pengiriman gagal. Periksa koneksi internet, lalu tekan Kirim ulang."}
}
function hasil(st){
const r=S.res,ok=st==="ok";
app.innerHTML=`<div class="card" style="text-align:center"><h1>Ujian selesai</h1><p class="mut">${esc(r.nama)} &middot; Kelas ${esc(r.kelas)} &middot; Absen ${esc(r.absen)}</p>
<div class="big">${r.nilai}</div><p>Nilai akhir (skala 0-100)</p>
<table><tr><th>Bagian</th><th class="c">Skor</th></tr><tr><td>Teks Deskripsi</td><td class="c">${r.D}</td></tr><tr><td>Teks Prosedur</td><td class="c">${r.P}</td></tr><tr><td>Teks Rekon</td><td class="c">${r.R}</td></tr></table>
<p class="mut">Pelanggaran pindah tab: ${r.pelanggaran} &middot; Durasi: ${r.durasi} menit</p>
<div class="note" style="${ok?"background:var(--acl);border-color:var(--ac)":""}">${ok?"Hasilmu sudah terkirim ke guru.":esc(st)}</div>
${!ok&&!/Mengirim/.test(st)?`<button class="btn" onclick="hasil('Mengirim ulang...');kirim().then(hasil)">Kirim ulang</button>`:""}</div>`;
}

/* ===== PENGAWAS TAB ===== */
function viol(){
if(!S.g||S.done)return;
if(Date.now()-S.lv<1500)return;
S.lv=Date.now();S.v++;
const e=$("#vc");if(e)e.textContent=S.v;
$("#wc").textContent="Total pelanggaran: "+S.v;
$("#warn").style.display="flex";
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)viol()});
window.addEventListener("blur",viol);
window.addEventListener("beforeunload",e=>{if(S.g&&!S.done){e.preventDefault();e.returnValue=""}});
["contextmenu","copy","cut","paste"].forEach(ev=>document.addEventListener(ev,e=>{if(!/INPUT|SELECT/.test(e.target.tagName)||ev==="contextmenu")e.preventDefault()}));
home();
</script>
</body>
</html>
